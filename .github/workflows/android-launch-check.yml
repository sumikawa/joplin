name: Android APK launch check

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Run ID containing an x86_64 emulator test APK
        required: true
        type: string
      artifact_name:
        description: Name of the x86_64 emulator APK artifact
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  launch:
    if: github.repository == 'sumikawa/joplin'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Download native emulator test APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: launch-apk

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch native APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 .github/scripts/check-android-launch.py

      - name: Upload startup logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-launch-evidence-${{ github.run_number }}
          path: launch-evidence/
          if-no-files-found: warn
          retention-days: 14
