// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        androidGradlePluginVersion = "9.2.1"
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24

        compileSdkVersion = 36
        targetSdkVersion = 36

        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.4.10"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:${androidGradlePluginVersion}")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")
    }
}

allprojects {
    // Native libraries declare their own plugin versions. Use the application's
    // toolchain consistently so an older plugin cannot load removed Gradle APIs.
    buildscript.configurations.configureEach {
        resolutionStrategy.eachDependency { dependency ->
            if (dependency.requested.group == "com.android.tools.build" && dependency.requested.name == "gradle") {
                dependency.useVersion(rootProject.ext.androidGradlePluginVersion)
            }
            if (dependency.requested.group == "org.jetbrains.kotlin" && dependency.requested.name == "kotlin-gradle-plugin") {
                dependency.useVersion(rootProject.ext.kotlinVersion)
            }
        }
    }
    repositories {
        google()
        mavenCentral()

        maven {
            // expo-camera bundles a custom com.google.android:cameraview
            url "$rootDir/../node_modules/expo-camera/android/maven"
        }
    }
}
 
apply plugin: "com.facebook.react.rootproject"
